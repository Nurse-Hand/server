name: CD

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_SERVER_REPOSITORY || 'nursehand-server' }}
  DEPLOY_ROOT: ${{ vars.GABIA_DEPLOY_ROOT || '/data/nurse-hand' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy on Gabia server
        env:
          SSH_HOST: ${{ secrets.GABIA_SSH_HOST }}
          SSH_PORT: ${{ secrets.GABIA_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.GABIA_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.GABIA_SSH_PASSWORD }}
          SERVER_IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail

          sshpass -p "${SSH_PASSWORD}" ssh \
            -p "${SSH_PORT}" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" \
            "set -euo pipefail; \
            cd '${DEPLOY_ROOT}'; \
            PREVIOUS_SERVER_IMAGE=\$(docker inspect -f '{{.Config.Image}}' nurse-hand-server 2>/dev/null || true); \
            rollback() { \
              echo 'Deploy failed. Rolling back...'; \
              if [ -n \"\${PREVIOUS_SERVER_IMAGE:-}\" ]; then \
                NURSE_HAND_SERVER_IMAGE=\"\${PREVIOUS_SERVER_IMAGE}\" docker compose --env-file .env -f docker-compose.prod.yml up -d api worker; \
                docker compose --env-file .env -f docker-compose.prod.yml ps; \
              fi; \
            }; \
            trap rollback ERR; \
            NURSE_HAND_SERVER_IMAGE='${SERVER_IMAGE_TAG}' docker compose --env-file .env -f docker-compose.prod.yml pull api worker; \
            NURSE_HAND_SERVER_IMAGE='${SERVER_IMAGE_TAG}' docker compose --env-file .env -f docker-compose.prod.yml up -d api worker; \
            docker compose --env-file .env -f docker-compose.prod.yml ps"
