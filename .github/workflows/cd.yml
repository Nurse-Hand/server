name: CD

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_SERVER_REPOSITORY || 'nursehand-server' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Gabia server
        env:
          SSH_HOST: ${{ secrets.GABIA_SSH_HOST }}
          SSH_PORT: ${{ secrets.GABIA_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.GABIA_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SERVER_IMAGE: ${{ env.IMAGE_NAME }}:latest
        run: |
          required_vars=(
            SSH_HOST
            SSH_PORT
            SSH_USER
            SSH_PRIVATE_KEY
            DOCKERHUB_USERNAME
            DOCKERHUB_TOKEN
            SERVER_IMAGE
          )
          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name}" ]]; then
              echo "Missing required CD environment variable: ${var_name}" >&2
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          export SSH_PRIVATE_KEY
          python3 <<'PY'
          import base64
          import os
          import pathlib
          import sys

          raw = os.environ["SSH_PRIVATE_KEY"].strip()
          candidate = raw.replace("\r\n", "\n").replace("\r", "\n")

          if "\\n" in candidate and "-----BEGIN" in candidate:
              candidate = candidate.replace("\\n", "\n")

          def looks_like_private_key(value: str) -> bool:
              return "-----BEGIN " in value and "PRIVATE KEY-----" in value

          if not looks_like_private_key(candidate):
              try:
                  decoded = base64.b64decode(raw).decode("utf-8")
              except Exception:
                  decoded = ""
              decoded = decoded.replace("\r\n", "\n").replace("\r", "\n")
              if looks_like_private_key(decoded):
                  candidate = decoded

          if not looks_like_private_key(candidate):
              print(
                  "GABIA_SSH_PRIVATE_KEY is not a valid raw or base64-encoded private key.",
                  file=sys.stderr,
              )
              sys.exit(1)

          path = pathlib.Path.home() / ".ssh" / "gabia_deploy_key"
          path.write_text(candidate.rstrip("\n") + "\n", encoding="utf-8")
          PY
          chmod 600 ~/.ssh/gabia_deploy_key
          ssh-keygen -y -f ~/.ssh/gabia_deploy_key >/dev/null

          ssh -i ~/.ssh/gabia_deploy_key \
            -p "${SSH_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${SSH_USER}@${SSH_HOST}" \
            "cd /data/nurse-hand && chmod +x deploy-server.sh && DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}' DOCKERHUB_TOKEN='${DOCKERHUB_TOKEN}' NURSE_HAND_SERVER_IMAGE='${SERVER_IMAGE}' bash ./deploy-server.sh"
