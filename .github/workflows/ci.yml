name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nh_it_user
          POSTGRES_PASSWORD: nh_it_password
          POSTGRES_DB: nh_it_nurse_hand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nh_it_user -d nh_it_nurse_hand"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate, seed twice, and run PostgreSQL integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://nh_it_user:nh_it_password@localhost:5432/nh_it_nurse_hand
