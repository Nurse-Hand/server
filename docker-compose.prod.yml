name: nurse-hand

services:
  db:
    image: postgres:16.4-alpine
    container_name: nurse-hand-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nurse_hand}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nurse_hand}
      POSTGRES_DB: ${POSTGRES_DB:-nurse_hand}
    volumes:
      - '${POSTGRES_DATA_DIR:-/data/nurse-hand/postgres}:/var/lib/postgresql/data'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-nurse_hand} -d ${POSTGRES_DB:-nurse_hand}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    image: ${NURSE_HAND_SERVER_IMAGE:-kimgt2828/nursehand-server:tagname}
    container_name: nurse-hand-server
    restart: unless-stopped
    env_file:
      - path: ${NURSE_HAND_ENV_FILE:-.env}
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://nurse_hand:nurse_hand@db:5432/nurse_hand}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_SESSION_TTL_SECONDS: ${DEMO_SESSION_TTL_SECONDS:-25200}
      NO_LOGIN_MVP_CONTEXT: ${NO_LOGIN_MVP_CONTEXT:-true}
      NO_LOGIN_MVP_DATASET_ID: ${NO_LOGIN_MVP_DATASET_ID:-00000000-0000-4000-8000-000000000101}
      FILE_STORAGE_ROOT: /data/nurse-hand/uploads
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
      AI_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      AI_PRIORITY_TIMEOUT_MS: ${AI_PRIORITY_TIMEOUT_MS:-15000}
    volumes:
      - '${FILE_STORAGE_HOST_ROOT:-/data/nurse-hand/uploads}:/data/nurse-hand/uploads'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ${NURSE_HAND_SERVER_IMAGE:-kimgt2828/nursehand-server:tagname}
    container_name: nurse-hand-worker
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: ${NURSE_HAND_ENV_FILE:-.env}
        required: false
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://nurse_hand:nurse_hand@db:5432/nurse_hand}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_SESSION_TTL_SECONDS: ${DEMO_SESSION_TTL_SECONDS:-25200}
      NO_LOGIN_MVP_CONTEXT: ${NO_LOGIN_MVP_CONTEXT:-true}
      NO_LOGIN_MVP_DATASET_ID: ${NO_LOGIN_MVP_DATASET_ID:-00000000-0000-4000-8000-000000000101}
      FILE_STORAGE_ROOT: /data/nurse-hand/uploads
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
      AI_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      AI_PRIORITY_TIMEOUT_MS: ${AI_PRIORITY_TIMEOUT_MS:-15000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
    volumes:
      - '${FILE_STORAGE_HOST_ROOT:-/data/nurse-hand/uploads}:/data/nurse-hand/uploads'
    command: ['node', 'dist/src/worker-main.js']
    healthcheck:
      disable: true

  ai:
    image: ${NURSE_HAND_AI_IMAGE:-jadest03/nurse-hand-ai:latest}
    container_name: nurse-hand-ai
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      DEEPGRAM_LANGUAGE: ${DEEPGRAM_LANGUAGE:-ko-KR}
      PYANNOTE_AUTH_TOKEN: ${PYANNOTE_AUTH_TOKEN:-}
      PYANNOTE_DIARIZATION_MODEL: ${PYANNOTE_DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.7}
      TOP_K_DEFAULT: ${TOP_K_DEFAULT:-3}
      MIN_SEGMENT_SEC: ${MIN_SEGMENT_SEC:-0.8}
      MIN_SPEAKER_TOTAL_SEC: ${MIN_SPEAKER_TOTAL_SEC:-1.2}
      KEEP_UPLOADS: ${KEEP_UPLOADS:-false}
      DATA_DIR: ${AI_DATA_DIR:-/data/nurse-hand/ai/data}
      TMP_DIR: ${AI_TMP_DIR:-/data/nurse-hand/ai/tmp}
      FFMPEG_BIN: ${FFMPEG_BIN:-ffmpeg}
    volumes:
      - '${AI_DATA_DIR:-/data/nurse-hand/ai/data}:${AI_DATA_DIR:-/data/nurse-hand/ai/data}'
      - '${AI_TMP_DIR:-/data/nurse-hand/ai/tmp}:${AI_TMP_DIR:-/data/nurse-hand/ai/tmp}'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status < 400 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  certbot:
    image: certbot/certbot:latest
    container_name: nurse-hand-certbot
    restart: 'no'
    volumes:
      - '${LETSENCRYPT_DIR:-/data/nurse-hand/letsencrypt}:/etc/letsencrypt'
      - '${CERTBOT_WEBROOT_DIR:-/data/nurse-hand/certbot/www}:/var/www/certbot'

  nginx:
    image: nginx:1.27-alpine
    container_name: nurse-hand-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - '${LETSENCRYPT_DIR:-/data/nurse-hand/letsencrypt}:/etc/letsencrypt:ro'
      - '${CERTBOT_WEBROOT_DIR:-/data/nurse-hand/certbot/www}:/var/www/certbot:ro'
    command: |
      sh -c "mkdir -p /var/www/certbot /etc/letsencrypt && if [ -s /etc/letsencrypt/live/api.nursehand.com/fullchain.pem ] && [ -s /etc/letsencrypt/live/api.nursehand.com/privkey.pem ]; then cat > /etc/nginx/conf.d/default.conf <<'EOF'
      server {
        listen 80;
        server_name api.nursehand.com;

        client_max_body_size 300M;

        location ^~ /.well-known/acme-challenge/ {
          root /var/www/certbot;
        }

        location / {
          return 301 https://api.nursehand.com$$request_uri;
        }
      }

      server {
        listen 443 ssl http2;
        server_name api.nursehand.com;

        ssl_certificate /etc/letsencrypt/live/api.nursehand.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.nursehand.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 300M;

        location = / {
          return 302 /docs;
        }

        location / {
          proxy_pass http://api:3000;
          proxy_http_version 1.1;

          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;

          proxy_read_timeout 300s;
          proxy_connect_timeout 60s;
          proxy_send_timeout 300s;
        }
      }
      EOF
      else cat > /etc/nginx/conf.d/default.conf <<'EOF'
      server {
        listen 80;
        server_name api.nursehand.com;

        client_max_body_size 300M;

        location ^~ /.well-known/acme-challenge/ {
          root /var/www/certbot;
        }

        location / {
          return 302 /docs;
        }
      }
      EOF
      fi
      nginx -g 'daemon off;'"
